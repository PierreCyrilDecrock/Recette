<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recette</title>
  <meta name="description" content="Créez, rangez et cuisinez vos recettes, même hors ligne.">
  <!-- Couleur de la barre du navigateur : identique à --fond dans chaque thème -->
  <meta name="theme-color" content="#f6f0ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171311" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>
    // Thème forcé dans les réglages (js/ecrans/reglages.js, même clé et mêmes couleurs) :
    // appliqué avant le premier rendu pour éviter un flash de couleur.
    try {
      const theme = localStorage.getItem('recette.theme');
      if (theme === 'clair' || theme === 'sombre') {
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').content = theme === 'clair' ? 'light' : 'dark';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.content = theme === 'clair' ? '#f6f0ea' : '#171311';
        });
      }
    } catch (erreur) {
      // Stockage local inaccessible : le thème suit le système
    }
  </script>
  <!-- Installation (PWA) : manifeste, icônes, réglages d'iOS -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/favicon.ico" sizes="32x32">
  <link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recette">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/composants.css">
  <link rel="stylesheet" href="css/ecrans.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Les libellés et icônes en dur servent de repli : app.js les remplace par ceux de
       js/textes.js et js/icones.js (data-texte, data-texte-aria, data-icone).
       Ordre du clavier : marque, onglets, « + », puis l'écran. Sur mobile, la barre
       d'onglets et le « + » sont fixés en bas (zone du pouce) ; dès 1024 px, ils
       prennent place dans l'en-tête. -->
  <header class="entete">
    <a class="entete__marque" href="#/">
      <span class="entete__logo" data-icone="toque" data-taille="28"></span>
      <span data-texte="app.nom">Recette</span>
    </a>

    <nav class="barre-onglets" aria-label="Navigation principale" data-texte-aria="app.navigation">
      <a class="barre-onglets__onglet" href="#/" data-onglet="recettes">
        <span class="barre-onglets__icone" data-icone="livre"></span>
        <span data-texte="app.onglets.recettes">Recettes</span>
      </a>
      <a class="barre-onglets__onglet" href="#/favoris" data-onglet="favoris">
        <span class="barre-onglets__icone" data-icone="coeur"></span>
        <span data-texte="app.onglets.favoris">Favoris</span>
      </a>
      <a class="barre-onglets__onglet" href="#/reglages" data-onglet="reglages">
        <span class="barre-onglets__icone" data-icone="reglages"></span>
        <span data-texte="app.onglets.reglages">Réglages</span>
      </a>
    </nav>

    <a class="bouton-flottant" href="#/nouvelle">
      <span class="bouton-flottant__icone" data-icone="plus" data-taille="28"></span>
      <span class="bouton-flottant__texte" data-texte="app.nouvelleRecette">Nouvelle recette</span>
    </a>
  </header>

  <main id="app" class="contenu" tabindex="-1"></main>
</body>
</html>
